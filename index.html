<!DOCTYPE html>
<html>
<head>
    <title>Mejorador Pro</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #1a1a1a; color: white; }
        .box { border: 2px dashed #444; padding: 20px; border-radius: 15px; background: #222; display: inline-block; }
        canvas { max-width: 100%; margin-top: 20px; border-radius: 10px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Mejorador de Fotos</h1>
        <input type="file" id="upload" accept="image/*"><br><br>
        <canvas id="canvas"></canvas><br><br>
        <button id="download">Descargar Mejorada</button>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        upload.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    // Dibujamos la imagen original
                    ctx.drawImage(img, 0, 0);
                    // Aplicamos un filtro de nitidez y brillo automático
                    ctx.filter = 'contrast(1.2) brightness(1.1) saturate(1.1)';
                    ctx.drawImage(canvas, 0, 0);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        document.getElementById('download').onclick = () => {
            const link = document.createElement('a');
            link.download = 'foto-mejorada.png';
            link.href = canvas.toDataURL();
            link.click();
        };
    </script>
</body>
</html>
