<!DOCTYPE html>
<html>
<head>
    <title>Mejorador de Imagen</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 30px; background: #121212; color: white; }
        .container { border: 2px solid #333; padding: 20px; border-radius: 20px; background: #1e1e1e; display: inline-block; }
        canvas { max-width: 100%; border-radius: 10px; margin: 20px 0; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        input { margin-bottom: 20px; }
        button { background: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mejorador de Nitidez</h1>
        <p>Sube una foto borrosa y mira la magia:</p>
        <input type="file" id="upload" accept="image/*"><br>
        <canvas id="canvas"></canvas><br>
        <button id="download">Descargar Resultado</button>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        upload.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Hacemos la imagen un poco más grande para ganar pixeles (Upscaling simple)
                    canvas.width = img.width * 1.5; 
                    canvas.height = img.height * 1.5;

                    // APLICAMOS FILTROS FUERTES
                    // contrast(1.5) = Mucho más contraste
                    // saturate(1.2) = Colores más vivos
                    // brightness(1.05) = Un pelín más de luz
                    ctx.filter = 'contrast(1.5) saturate(1.2) brightness(1.05) blur(0px)';
                    
                    // Dibujamos la imagen estirándola para que la IA del navegador suavice los bordes
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // Segundo pase de nitidez (Truco visual)
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.globalAlpha = 0.1;
                    ctx.drawImage(canvas, 0, 0);
                    ctx.globalAlpha = 1.0;
                    ctx.globalCompositeOperation = 'source-over';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        document.getElementById('download').onclick = () => {
            const link = document.createElement('a');
            link.download = 'imagen_mejorada.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        };
    </script>
</body>
</html>
